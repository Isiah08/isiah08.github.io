/* Reply desk. A text comes in from a number you don't recognise — type the last
   four digits, find out who it is and what they were sent, then answer. */
:root{
  --bg:#0C0D0F; --card:#141619; --card-2:#1B1E22;
  --fg:#F2F0EC; --mid:#A2A8AF; --dim:#6B7178;
  --go:#3B8E5A; --go-2:#2E7047; --wait:#B8853A; --no:#8A4B4B;
  --line:rgba(242,240,236,.12);
  --s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:"Inter Tight",-apple-system,system-ui,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding:0 0 env(safe-area-inset-bottom)}
.wrap{max-width:640px;margin-inline:auto;padding:var(--s5) var(--s4) 64px}
a{color:inherit}
:focus-visible{outline:2px solid var(--go);outline-offset:3px}

header{padding-block:var(--s4) var(--s4)}
h1{margin:0 0 var(--s2);font-size:1.5rem;font-weight:700;letter-spacing:-.02em}
.sub{margin:0;color:var(--mid);font-size:.92rem}

.search{position:sticky;top:0;z-index:10;background:var(--bg);
  padding-block:var(--s3) var(--s4);margin-bottom:var(--s3)}
#q{width:100%;min-height:52px;padding:0 var(--s4);border-radius:10px;
  background:var(--card-2);border:1px solid var(--line);color:var(--fg);
  font-family:inherit;font-size:1rem}
#q::placeholder{color:var(--dim)}

.bar{display:flex;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s4)}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);
  background:transparent;color:var(--mid);font-family:inherit;font-size:.78rem;
  cursor:pointer;-webkit-tap-highlight-color:transparent}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
.chip b{font-variant-numeric:tabular-nums}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:var(--s4);margin-bottom:var(--s3)}
.card.st-sold{border-color:var(--go)}
.card.st-no{opacity:.5}
.name{font-weight:600;font-size:1.05rem;line-height:1.25}
.meta{margin:4px 0 0;font-size:.82rem;color:var(--mid)}
.stars{color:#E4B15A}
.num{margin:var(--s3) 0 0;font-size:.9rem;color:var(--fg);
  font-variant-numeric:tabular-nums;font-weight:600}
.was{margin:var(--s2) 0 0;font-size:.78rem;color:var(--dim);
  overflow-wrap:anywhere}

.sent{margin:var(--s3) 0 0;padding:var(--s3);background:var(--card-2);
  border-radius:8px;font-size:.82rem;color:var(--mid);white-space:pre-wrap;
  max-height:0;overflow:hidden;padding-top:0;padding-bottom:0;
  transition:max-height .25s ease,padding .25s ease}
.card.open .sent{max-height:460px;padding-top:var(--s3);padding-bottom:var(--s3)}
.toggle{margin-top:var(--s3);font-size:.8rem;color:var(--dim);background:none;
  border:0;padding:0;cursor:pointer;font-family:inherit}

.status{display:flex;gap:var(--s2);margin-top:var(--s4);flex-wrap:wrap}
.st{flex:1;min-width:70px;min-height:44px;border-radius:8px;border:1px solid var(--line);
  background:transparent;color:var(--mid);font-family:inherit;font-size:.82rem;
  font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent}
.st.on{color:var(--bg);background:var(--fg);border-color:var(--fg)}
.st.on[data-s="sold"]{background:var(--go);border-color:var(--go);color:#fff}
.st.on[data-s="no"]{background:var(--no);border-color:var(--no);color:#fff}
.tel{display:block;margin-top:var(--s3);min-height:46px;line-height:46px;
  text-align:center;border-radius:8px;background:var(--card-2);
  border:1px solid var(--line);color:var(--fg);font-weight:600;font-size:.9rem;
  text-decoration:none}

h2{margin:var(--s6) 0 var(--s3);font-size:.7rem;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim)}
.scr{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:var(--s4);margin-bottom:var(--s3)}
.scr h3{margin:0 0 var(--s2);font-size:.95rem;font-weight:600}
.scr p{margin:0 0 var(--s3);font-size:.85rem;color:var(--dim)}
.scr pre{margin:0;padding:var(--s3);background:var(--card-2);border-radius:8px;
  font-family:inherit;font-size:.86rem;color:var(--mid);white-space:pre-wrap}
.cp{margin-top:var(--s3);min-height:42px;width:100%;border-radius:8px;
  border:1px solid var(--line);background:transparent;color:var(--mid);
  font-family:inherit;font-size:.84rem;font-weight:600;cursor:pointer}
.cp.ok{color:var(--go);border-color:var(--go)}

.empty{padding:var(--s6) var(--s4);text-align:center;color:var(--dim)}
footer{margin-top:var(--s6);padding-top:var(--s4);border-top:1px solid var(--line);
  font-size:.8rem;color:var(--dim)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<header>

<div id="scripts"></div>

<footer>

  <br>One follow-up. Never two.
</footer>

</div>

   m:"No worries if you're slammed — link's still up if you want a look."}
];

const LABEL = {booking:"was on a booking page", social:"social only", nothing:"nothing online"};
const STATES = [["replied","Replied"],["sold","Sold"],["no","No"],["","Clear"]];

const list = document.getElementById("list");
const q = document.getElementById("q");
let filter = "all";

function pretty(p){ const d=p.replace(/\D/g,"").slice(-10);
  return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`; }

function card(b){
  const st = status[b.p] || "";
  const el = document.createElement("div");
  el.className = "card" + (st ? " st-"+st : "");
  el.innerHTML = `
    <div class="name"></div>
    <p class="meta"><span class="stars"></span><span class="rest"></span></p>
    <p class="num"></p>
    <p class="was"></p>
    <a class="tel" href="">Call</a>
    <button class="toggle" type="button">What they were sent</button>
    <div class="sent"></div>
    <div class="status"></div>`;

  el.querySelector(".name").textContent  = b.n;
  el.querySelector(".stars").textContent = b.s ? "★ " + b.s : "";
  el.querySelector(".rest").textContent  = (b.s?" · ":"") + b.cat + " · " + b.rev
                                         + " reviews · " + LABEL[b.g] + (b.c?" · "+b.c:"");
  el.querySelector(".num").textContent   = pretty(b.p);
  el.querySelector(".was").textContent   = b.was ? "Their page: " + b.was : "";
  const tel = el.querySelector(".tel");
  tel.setAttribute("href", "tel:" + b.p);
  el.querySelector(".sent").textContent  = b.m;

  el.querySelector(".toggle").addEventListener("click", e => {
    el.classList.toggle("open");
    e.target.textContent = el.classList.contains("open") ? "Hide" : "What they were sent";
  });

  const row = el.querySelector(".status");
  STATES.forEach(([val,label]) => {
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "st" + (st===val && val ? " on" : "");
    btn.dataset.s = val; btn.textContent = label;
    btn.addEventListener("click", () => {
      if (val) status[b.p] = val; else delete status[b.p];
      save(); render();
    });
    row.appendChild(btn);
  });
  return el;
}

function matches(b){
  const term = q.value.trim().toLowerCase();
  if (term){
    const digits = term.replace(/\D/g,"");
    const hitNum  = digits && b.p.replace(/\D/g,"").includes(digits);
    const hitName = b.n.toLowerCase().includes(term);
    if (!hitNum && !hitName) return false;
  }
  const st = status[b.p] || "none";
  if (filter === "all") return true;
  if (filter === "noreply") return st === "none";
  return st === filter;
}

function render(){
  const counts = {all:BIZ.length, replied:0, sold:0, no:0, noreply:0};
  BIZ.forEach(b => { const s = status[b.p]||"none";
    if (s==="none") counts.noreply++; else counts[s]++; });

  const f = document.getElementById("filters");
  f.replaceChildren();
  [["all","All"],["noreply","No reply yet"],["replied","Replied"],
   ["sold","Sold"],["no","No"]].forEach(([k,label]) => {
    const b = document.createElement("button");
    b.type="button"; b.className="chip"+(filter===k?" on":"");
    b.innerHTML = label + " <b>" + counts[k] + "</b>";
    b.onclick = () => { filter = k; render(); };
    f.appendChild(b);
  });

  const hits = BIZ.filter(matches);
  list.replaceChildren();
  if (!hits.length){
    const d=document.createElement("div"); d.className="empty";
    d.textContent = q.value ? "No lead matches that." : "Nothing in this filter.";
    list.appendChild(d);
  } else hits.forEach(b => list.appendChild(card(b)));
}

const scr = document.getElementById("scripts");
SCRIPTS.forEach(s => {
  const d = document.createElement("div");
  d.className = "scr";
  d.innerHTML = `<h3></h3><p></p><pre></pre><button class="cp" type="button">Copy</button>`;
  d.querySelector("h3").textContent = s.t;
  d.querySelector("p").textContent  = s.w;
  d.querySelector("pre").textContent = s.m;
  d.querySelector(".cp").addEventListener("click", async e => {
    try { await navigator.clipboard.writeText(s.m); } catch {}
    e.target.textContent = "Copied"; e.target.classList.add("ok");
    setTimeout(()=>{ e.target.textContent="Copy"; e.target.classList.remove("ok"); },1600);
  });
  scr.appendChild(d);
});

q.addEventListener("input", render);
render();
</script>
</body>
</html>
